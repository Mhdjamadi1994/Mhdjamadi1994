<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="transparent"/>
  
  <!-- Pac-Man Body with Animation -->
  <path fill="Red" d="M100,100 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0 Z">
    <animate attributeName="d" 
             values="M100,100 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0 Z;
                      M100,100 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0 Z;
                      M100,100 m-30,0 a40,40 0 1,1 60,0 a40,40 0 1,1 -60,0 Z;
                      M100,100 m-40,0 a40,40 0 1,1 80,0 a40,40 0 1,1 -80,0 Z" 
             dur="0.4s" repeatCount="indefinite" />
  </path>
  
  <!-- Small Dots (Food) -->
  <circle cx="50" cy="50" r="3" fill="white" />
  <circle cx="150" cy="50" r="3" fill="white" />
  <circle cx="50" cy="150" r="3" fill="white" />
  <circle cx="150" cy="150" r="3" fill="white" />
</svg>
