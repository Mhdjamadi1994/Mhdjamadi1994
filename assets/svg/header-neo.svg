<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mhd Jamadi Header">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03150f"/>
      <stop offset="60%" stop-color="#07291d"/>
      <stop offset="100%" stop-color="#041b13"/>
    </linearGradient>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title { font: 800 56px "Segoe UI", Arial, sans-serif; fill: #eafff4; letter-spacing: 1px; }
      .subtitle { font: 600 22px "Segoe UI", Arial, sans-serif; fill: #95ffd0; }
      .chipText { font: 600 14px "Segoe UI", Arial, sans-serif; fill: #dfffee; }
      .neon { stroke: #2cff88; filter: url(#glow); }
    </style>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="1180" height="300" rx="16" fill="none" class="neon" stroke-width="2"/>

  <text x="60" y="112" class="title">MHD JAMADI</text>
  <text x="60" y="150" class="subtitle">AI ENGINEER • BACKEND DEVELOPER</text>

  <g transform="translate(60,198)">
    <rect x="0" y="0" width="96" height="30" rx="15" fill="#0d3325" class="neon" stroke-width="1"/>
    <text x="26" y="20" class="chipText">Python</text>

    <rect x="108" y="0" width="92" height="30" rx="15" fill="#0d3325" class="neon" stroke-width="1"/>
    <text x="136" y="20" class="chipText">Django</text>

    <rect x="212" y="0" width="92" height="30" rx="15" fill="#0d3325" class="neon" stroke-width="1"/>
    <text x="240" y="20" class="chipText">FastAPI</text>

    <rect x="316" y="0" width="74" height="30" rx="15" fill="#0d3325" class="neon" stroke-width="1"/>
    <text x="341" y="20" class="chipText">SQL</text>

    <rect x="402" y="0" width="78" height="30" rx="15" fill="#0d3325" class="neon" stroke-width="1"/>
    <text x="428" y="20" class="chipText">Git</text>
  </g>

  <!-- safe avatar placeholder (no embedded image) -->
  <circle cx="980" cy="160" r="100" fill="none" class="neon" stroke-width="2"/>
  <circle cx="980" cy="160" r="92" fill="#0a2b1f"/>
  <text x="980" y="166" text-anchor="middle" style="font:600 14px Segoe UI,Arial; fill:#95ffd0;">PROFILE</text>
</svg>
